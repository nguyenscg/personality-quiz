<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;700&family=Irish+Grover&display=swap" rel="stylesheet">

    <title>Animal Folk Quiz</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <img src="{{ url_for('static', filename='junie.png') }}" class="junie-icon">


    <h1>{{question.text}}</h1>

    <form method="POST">
        {% for option in question.options %}
        <button type="submit" name="answer" value="{{ option.animal }}">
            {{ option.text }}
        </button>

        {% endfor %}
    </form>



</body>
</html>
